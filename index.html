<!doctype html>
<html lang="en" data-theme="retro" data-theme-tone="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <title>ez.down</title>
  </head>
  <body>
    <div id="app">
      <header id="navbar" class="navbar">
        <div class="navbar-leading">
          <img
            id="navbar-logo"
            class="navbar-logo"
            src="/src/assets/logo.png"
            alt="ez.down"
            width="28"
            height="28"
          />
          <nav class="navbar-menus" aria-label="Application menu">
            <button
              id="menu-file"
              class="nav-menu-btn"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              File
            </button>
            <button
              id="menu-settings"
              class="nav-menu-btn"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              Settings
            </button>
            <button
              id="menu-help"
              class="nav-menu-btn"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              Help
            </button>
          </nav>
        </div>
        <div class="navbar-drag" data-tauri-drag-region></div>
        <div class="window-controls" id="window-controls">
          <button
            type="button"
            class="win-btn minimize"
            title="Minimize"
            aria-label="Minimize"
          ></button>
          <button
            type="button"
            class="win-btn maximize"
            title="Maximize"
            aria-label="Maximize"
          ></button>
          <button
            type="button"
            class="win-btn close"
            title="Close"
            aria-label="Close"
          ></button>
        </div>
      </header>

      <main class="workspace">
        <div id="editor-host" class="editor-host"></div>

        <div id="empty-state" class="empty-state">
          <div class="empty-card">
            <img
              class="empty-logo"
              src="/src/assets/logo.png"
              alt=""
              width="64"
              height="64"
            />
            <h1>ez.down</h1>
            <p>Edit formatted Markdown without seeing the syntax.</p>
            <div class="empty-actions">
              <button id="empty-new-file" class="btn btn-primary edit-only"></button>
              <button id="empty-open-file" class="btn"></button>
              <button id="empty-open-folder" class="btn"></button>
            </div>
          </div>
        </div>

        <footer id="bottom-bar" class="bottom-bar">
          <div id="tabbar" class="tabbar"></div>
          <div id="statusbar" class="statusbar" hidden>
            <div class="status-left">
              <span class="status-item" id="st-words"></span>
              <span class="status-item" id="st-chars"></span>
              <span class="status-item" id="st-lines"></span>
            </div>
            <div class="status-right">
              <span class="status-item" id="st-size"></span>
              <span class="status-item" id="st-modified"></span>
            </div>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
